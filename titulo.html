<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Titulo</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene cursor="rayOrigin: mouse">
      <a-assets>
        <a-asset-item id="street" src="activos/street.glb"></a-asset-item>
        <a-asset-item id="ambulancia" src="activos/ambulancia.glb"></a-asset-item>        
        <audio id="interact" src="sonidos/interact.mp3"></audio>
        <audio id="finish" src="sonidos/finish.mp3"></a-audio>
        <audio id="ambient_city" src="sonidos/ambient_city.mp3"></audio>
      </a-assets>
      <a-entity gltf-model="#street" position="-5 5 -7" rotation="0 -50 0" scale="10 10 10"></a-entity>
      <a-entity gltf-model="#ambulancia" position="3 0.4 -7" rotation="0 100 0" scale="0.3 0.3 0.3"></a-entity>
      <a-entity camera="fov:60" position="-2 1.6 0"
      sound="src: #ambient_city; loop: true; autoplay: true; positional: false; volume: 0.5"
      light="type: spot; color: #FFFFFF; intensity: 3; angle: 35; penumbra: 0.5; distance: 15"
      position="0 0 -0.5"
      rotation="0 0 0">
      <a-entity id="mainMenu" position="0 0 -3">
  <a-plane
    position="-0.05 -0.1 -0.05"
    width="3"
    height="3"
    color="#000000"
    opacity="0.65">
</a-plane>
    <a-text
        value="Simulador de emergencias"
        align="center"
        color="#FFFFFF"
        width="5"
        position="0 1 0">
    </a-text>
    <a-text
        id="start"
        value="CASO UNO"
        align="center"
        color="#FFFFFF"
        width="3"
        position="0 0 0"
        class="menu-option"
        raycastable="true"
        sound="src: #interact; on: click; positional: true"
        event-set__mouseenter="color: #FF4444"
        event-set__mouseleave="color: #FFFFFF">
    </a-text>
    <a-text
        id="opciones"
        value="OPCIONES"
        align="center"
        color="#7f8c8d"
        width="3"
        position="0 -0.4 0"
        class="menu-option"
        raycastable="true"
        sound="src: #interact; on: click; positional: true"
        event-set__mouseenter="color: #FF4444"
        event-set__mouseleave="color: #7f8c8d">
    </a-text>
    <a-text
        id="resultados"
        value="RESULTADOS"
        align="center"
        color="#7f8c8d"
        width="3"
        position="0 -0.8 0"
        class="menu-option"
        raycastable="true"
        sound="src: #interact; on: click; positional: true"
        event-set__mouseenter="color: #FF4444"
        event-set__mouseleave="color: #7f8c8d">
    </a-text>

</a-entity>
</a-entity>
<a-entity light="type: spot; color: #e74c3c; intensity: 80; angle: 90; penumbra: 0.5; distance: 8" position="3 6 -6"
       animation="property: rotation; from: 0 0 0; to: 0 360 0; loop: true; dur: 1000; easing: linear"> </a-entity>
      <a-sky color="#1B2033"></a-sky>
      

      
      <a-light type="ambient" color="#8FA0D8" intensity="0.25"></a-light>
    </a-scene>
    <script>

    // Get the interaction sound
    const interactSound = document.querySelector("#interact");


    // Get all menu options
    const menuOptions = document.querySelectorAll(".menu-option");


    menuOptions.forEach(function(option) {

        // MOUSE ENTER
        option.addEventListener("mouseenter", function() {

            // Change color
            option.setAttribute("color", "#e74c3c");

            // Make text slightly bigger
            option.setAttribute("scale", "1.1 1.1 1.1");

        });


        // MOUSE LEAVE
        option.addEventListener("mouseleave", function() {

            // Return to white
            option.setAttribute("color", "#FFFFFF");

            // Return to normal size
            option.setAttribute("scale", "1 1 1");

        });


        // CLICK
        option.addEventListener("click", function() {

            // Play interaction sound
            interactSound.currentTime = 0;
            interactSound.play();


            // Determine which option was clicked

            if (option.id === "start") {

    const fade = document.querySelector("#fade");

    fade.classList.add("active");

    setTimeout(function() {

        window.location.href = "bosque.html";

    }, 1000);

}


            else if (option.id === "opciones") {

                console.log("OPCIONES");

                // Your options-menu code goes here

            }


            else if (option.id === "resultados") {

                console.log("RESULTADOS");

                // Your results code goes here

            }

        });

    });

</script>
<div id="fade"></div>

<style>
    #fade {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease;
        z-index: 9999;
    }

    #fade.active {
        opacity: 1;
    }
</style>
  </body>
</html>
